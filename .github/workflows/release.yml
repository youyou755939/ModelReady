name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Build zip and checksum
        shell: pwsh
        run: ./build.ps1 -OutputDirectory .
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = @(Get-ChildItem -File 'ModelReady-*-windows-x64.zip')
          if ($zips.Count -ne 1) { throw "期望一个发行包，实际找到 $($zips.Count) 个" }
          $zip = $zips[0]
          gh release create "${{ github.ref_name }}" $zip.FullName "$($zip.FullName).sha256" --generate-notes
