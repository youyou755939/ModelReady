name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Build zip and checksum
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ModelReady'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item modelready.ps1,Install-ModelReady.cmd,Doctor-ModelReady.cmd,README.md,LICENSE -Destination $stage
          Copy-Item config,scripts,src -Destination $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath ModelReady-windows-x64.zip
          (Get-FileHash ModelReady-windows-x64.zip -Algorithm SHA256).Hash + '  ModelReady-windows-x64.zip' |
            Set-Content ModelReady-windows-x64.zip.sha256 -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ModelReady-windows-x64.zip ModelReady-windows-x64.zip.sha256 --generate-notes

