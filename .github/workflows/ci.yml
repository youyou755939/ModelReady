name: ci

on:
  push:
  pull_request:

jobs:
  powershell-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        shell: pwsh
        run: ./tests/smoke.ps1
      - name: Install and verify base profile
        shell: pwsh
        run: ./modelready.ps1 install -Profile base -EnvironmentRoot "$env:RUNNER_TEMP\modelready-envs" -Yes -NoReport
      - name: Build distributable package
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$env:RUNNER_TEMP\dist"

  linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash ./tests/linux-smoke.sh
      - name: Install and verify base profile
        run: bash ./modelready.sh install --profile base --environment-root "$RUNNER_TEMP/modelready-envs" --yes --no-report
